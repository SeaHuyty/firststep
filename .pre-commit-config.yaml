# Run `pre-commit install` once after cloning; the hooks then run on every commit.
# Ruff picks up its settings from server/pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in step with server/pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd server && mypy'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (layer rules)
        entry: bash -c 'cd server && lint-imports'
        language: system
        files: ^server/
        types: [python]
        pass_filenames: false
