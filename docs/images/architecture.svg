<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="FirstStep architecture: taps, typed messages and the Confirm click all reach one executor, where the guardian checks every tool call against the rules before any tool runs; the LLM only picks tools and never sees order tools or tokens; every step is written to a hash-chained audit log." font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3F5457"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0A7D55"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C2412D"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A8B8A"/>
    </marker>
  </defs>

  <!-- Its own background, so it reads the same on light and dark pages. -->
  <rect width="1200" height="700" fill="#F6F8F7"/>

  <text x="30" y="42" font-size="22" font-weight="600" fill="#0C1F22">FirstStep: the LLM talks, the guardian decides</text>
  <text x="30" y="66" font-size="13" fill="#3F5457">Three ways in, one gate. Nothing runs, and no money moves, until the rules allow it.</text>

  <!-- Column A: the three ways in -->
  <text x="30" y="104" font-size="11" font-weight="600" letter-spacing="1" fill="#5A6C6E">THE PERSON</text>
  <g font-size="14" fill="#0C1F22">
    <rect x="30" y="120" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="120" y="144" text-anchor="middle" font-weight="600">Taps a chip</text>
    <text x="120" y="163" text-anchor="middle" font-size="12" fill="#3F5457">or a button</text>

    <rect x="30" y="300" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="120" y="324" text-anchor="middle" font-weight="600">Types a message</text>
    <text x="120" y="343" text-anchor="middle" font-size="12" fill="#3F5457">"Put it all in tech"</text>

    <rect x="30" y="480" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="120" y="504" text-anchor="middle" font-weight="600">Presses Confirm</text>
    <text x="120" y="523" text-anchor="middle" font-size="12" fill="#3F5457">after reviewing orders</text>
  </g>

  <!-- Column B: input guard and token minter -->
  <g font-size="14" fill="#0C1F22">
    <rect x="270" y="300" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="355" y="324" text-anchor="middle" font-weight="600">Input guard</text>
    <text x="355" y="343" text-anchor="middle" font-size="12" fill="#3F5457">masks IDs, flags injection</text>

    <rect x="270" y="480" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="355" y="504" text-anchor="middle" font-weight="600">Token minter</text>
    <text x="355" y="523" text-anchor="middle" font-size="12" fill="#3F5457">one-time HMAC, server only</text>
  </g>

  <!-- Column C: the LLM -->
  <g font-size="14" fill="#0C1F22">
    <rect x="490" y="270" width="190" height="116" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="585" y="296" text-anchor="middle" font-weight="600">Sprout (the LLM)</text>
    <text x="585" y="318" text-anchor="middle" font-size="12" fill="#3F5457">chooses a tool, writes</text>
    <text x="585" y="334" text-anchor="middle" font-size="12" fill="#3F5457">the words from its result</text>
    <text x="585" y="358" text-anchor="middle" font-size="11" fill="#C2412D">never sees order tools</text>
    <text x="585" y="374" text-anchor="middle" font-size="11" fill="#C2412D">or tokens</text>
  </g>

  <!-- Arrows into the executor -->
  <g font-size="12" fill="#3F5457">
    <line x1="210" y1="148" x2="728" y2="148" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="470" y="140" text-anchor="middle">tool + answer, no LLM</text>

    <line x1="210" y1="328" x2="268" y2="328" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="440" y1="328" x2="488" y2="328" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="680" y1="328" x2="728" y2="328" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="704" y="318" text-anchor="middle">a tool</text>

    <line x1="210" y1="508" x2="268" y2="508" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="440" y1="508" x2="728" y2="508" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="660" y="500" text-anchor="middle">place_order + token</text>
  </g>

  <!-- Column D: executor with the guardian inside -->
  <rect x="730" y="100" width="210" height="460" rx="12" fill="#FFFFFF" stroke="#0C1F22" stroke-width="1.5"/>
  <text x="835" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#0C1F22">Executor</text>
  <text x="835" y="144" text-anchor="middle" font-size="12" fill="#3F5457">one path for every call</text>

  <rect x="748" y="168" width="174" height="300" rx="10" fill="#E7F5EE" stroke="#0A7D55" stroke-width="2"/>
  <text x="835" y="194" text-anchor="middle" font-size="15" font-weight="600" fill="#0A7D55">Guardian</text>
  <text x="835" y="212" text-anchor="middle" font-size="12" fill="#3F5457">rules.yaml · tested Python</text>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="12" fill="#0C1F22" text-anchor="middle">
    <text x="835" y="244">STAGE-01  this step?</text>
    <text x="835" y="270">READY-01/02  ready?</text>
    <text x="835" y="296">SUIT-01  fits level</text>
    <text x="835" y="322">CONC-01  spread out</text>
    <text x="835" y="348">CONF-01  real click</text>
    <text x="835" y="374">LIM-01  limits</text>
    <text x="835" y="400">COOL-01  24h pause</text>
  </g>
  <text x="835" y="428" text-anchor="middle" font-size="11" fill="#3F5457">HOR-01, DRIFT-01 apply</text>
  <text x="835" y="443" text-anchor="middle" font-size="11" fill="#3F5457">inside the tools</text>
  <text x="835" y="460" text-anchor="middle" font-size="11" font-weight="600" fill="#0A7D55">checks first, then runs</text>

  <text x="835" y="500" text-anchor="middle" font-size="12" fill="#3F5457">one database transaction</text>
  <text x="835" y="518" text-anchor="middle" font-size="12" fill="#3F5457">per call</text>

  <!-- Column E: what an allowed call reaches, and a refusal -->
  <g font-size="14" fill="#0C1F22">
    <rect x="990" y="120" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#0A7D55" stroke-width="1.5"/>
    <text x="1080" y="144" text-anchor="middle" font-weight="600">19 typed tools</text>
    <text x="1080" y="163" text-anchor="middle" font-size="12" fill="#3F5457">strict inputs and outputs</text>

    <rect x="990" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="1080" y="254" text-anchor="middle" font-weight="600">Finance engine</text>
    <text x="1080" y="273" text-anchor="middle" font-size="12" fill="#3F5457">pure math, 2000–2025 data</text>

    <rect x="990" y="330" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#7A8B8A"/>
    <text x="1080" y="354" text-anchor="middle" font-weight="600">Practice account</text>
    <text x="1080" y="373" text-anchor="middle" font-size="12" fill="#3F5457">SQLite, no real money</text>

    <rect x="990" y="440" width="180" height="56" rx="10" fill="#FCEDEA" stroke="#C2412D" stroke-width="1.5"/>
    <text x="1080" y="464" text-anchor="middle" font-weight="600" fill="#C2412D">Refusal card</text>
    <text x="1080" y="483" text-anchor="middle" font-size="12" fill="#3F5457">rule ID + plain words</text>
  </g>
  <g font-size="12">
    <line x1="922" y1="200" x2="988" y2="152" stroke="#0A7D55" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="962" y="196" text-anchor="middle" fill="#0A7D55" font-weight="600" stroke="#F6F8F7" stroke-width="5" stroke-linejoin="round" paint-order="stroke">allowed</text>
    <line x1="922" y1="440" x2="988" y2="466" stroke="#C2412D" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="962" y="478" text-anchor="middle" fill="#C2412D" font-weight="600" stroke="#F6F8F7" stroke-width="5" stroke-linejoin="round" paint-order="stroke">refused</text>

    <line x1="1080" y1="176" x2="1080" y2="228" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1088" y="207" fill="#3F5457">computes</text>
    <path d="M1170 160 Q1194 160 1194 250 Q1194 358 1172 358" fill="none" stroke="#3F5457" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1160" y="304" text-anchor="end" fill="#3F5457">reads, writes</text>
  </g>

  <!-- Audit log: everything is written down -->
  <rect x="30" y="610" width="1140" height="60" rx="10" fill="#0C2B2A"/>
  <text x="50" y="636" font-size="14" font-weight="600" fill="#E8F0EE">Hash-chained audit log</text>
  <text x="50" y="656" font-size="12" fill="#C9D7D4">Each event stores the fingerprint of the one before; the latest is kept outside the log, so any edit or deletion is detectable.</text>
  <g stroke="#7A8B8A" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="355" y1="536" x2="355" y2="606" marker-end="url(#arrow-muted)"/>
    <line x1="585" y1="386" x2="585" y2="606" marker-end="url(#arrow-muted)"/>
    <line x1="835" y1="560" x2="835" y2="606" marker-end="url(#arrow-muted)"/>
    <line x1="1080" y1="496" x2="1080" y2="606" marker-end="url(#arrow-muted)"/>
  </g>
  <text x="600" y="596" font-size="11" fill="#5A6C6E">every message, call, decision and fill</text>
</svg>
