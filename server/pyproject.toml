[project]
name = "firststep-server"
version = "0.1.0"
description = "FirstStep: a trustworthy first investing advisor (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "pydantic-ai-slim[openai,anthropic,google]",
  "pyyaml",
  "numpy",
  "yfinance",          # old market layer; removed with app/market in M4
  "pandas",            # old what-if layer; removed in M4
]

[project.optional-dependencies]
dev = [
  "ruff==0.17.1",       # keep in step with .pre-commit-config.yaml
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",        # FastAPI TestClient
  "hypothesis>=6",      # property tests for the finance engine
  "pre-commit>=4",
  "import-linter>=2",   # enforces the layer rules in standards/backend.md
  "types-PyYAML",
  "openpyxl",           # scripts/build_returns.py reads the World Bank workbook
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 99          # PEP 8 allows teams to agree on up to 99
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle: PEP 8 layout (W505 enforces the 72-char doc limit)
  "F",         # pyflakes: unused imports, undefined names
  "I",         # isort: import order
  "N",         # pep8-naming
  "UP",        # pyupgrade: modern syntax for 3.11
  "B",         # bugbear: likely bugs
  "C4",        # comprehensions
  "SIM",       # simplifications
  "RUF",       # ruff's own checks
  "ANN",       # type annotations on every function
  "D",         # docstrings on public modules, classes, functions
  "T20",       # no print(); use logging
  "PT",        # pytest style
  "PTH",       # pathlib over os.path
  "DTZ",       # timezone-aware datetimes (audit log timestamps)
  "S",         # bandit security checks
  "PL",        # pylint subset: too many args/branches, magic values
]
ignore = [
  "D100", "D104",   # module and package docstrings are optional
  "D203", "D213",   # pick one docstring style (google, below)
  "PLR2004",        # magic numbers are fine in tests and rules tables
]

# Typographic dashes and quotes are intended in user-facing copy, such as
# "2–5 years" and the sources' titles.
allowed-confusables = ["–", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PLR2004"]
"scripts/**" = ["T20", "D"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72       # PEP 8: comments and docstrings still wrap at 72 when code goes to 99

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 4

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["pandas.*", "yfinance.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
  "llm: needs a real LLM key; skipped in CI",
  "slow: takes more than a second",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Layer rules from standards/backend.md section 2. Run with `lint-imports`.
# A module may import from layers below it, never above. store, audit,
# llm and core are services handed to the upper layers.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> agent -> policy -> tools -> engine"
type = "layers"
layers = ["app.api", "app.agent", "app.policy", "app.tools", "app.engine"]

[[tool.importlinter.contracts]]
name = "Engine is pure: no web, database, LLM, files or upper layers"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = [
  "fastapi", "pydantic_ai", "yaml", "sqlite3",
  "app.store", "app.audit", "app.llm", "app.core.settings", "app.core.reference",
]

[[tool.importlinter.contracts]]
name = "Core depends on nothing else in app"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
  "app.api", "app.agent", "app.policy", "app.tools", "app.engine",
  "app.store", "app.audit", "app.llm",
]

[[tool.importlinter.contracts]]
name = "Store and audit are services: they never call back up"
type = "forbidden"
source_modules = ["app.store", "app.audit"]
forbidden_modules = ["app.api", "app.agent", "app.policy", "app.tools", "app.llm"]

[[tool.importlinter.contracts]]
name = "Only app.llm knows an LLM provider exists"
type = "forbidden"
source_modules = [
  "app.api", "app.agent", "app.policy", "app.tools", "app.engine",
  "app.store", "app.audit", "app.core",
]
forbidden_modules = ["anthropic", "openai", "google"]

[[tool.importlinter.contracts]]
name = "Only app.llm and app.agent use pydantic-ai"
type = "forbidden"
source_modules = [
  "app.api", "app.policy", "app.tools", "app.engine", "app.store", "app.audit", "app.core",
]
forbidden_modules = ["pydantic_ai"]

# Contracts for the old layout, removed with the old modules in M4.

[[tool.importlinter.contracts]]
name = "Layers: main -> routes -> ai -> domain"
type = "layers"
layers = ["app.main", "app.routes", "app.ai", "app.domain"]

[[tool.importlinter.contracts]]
name = "Domain is pure: no web, LLM, market or I/O service imports"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "pydantic_ai", "yfinance", "app.ai", "app.market", "app.routes"]

[[tool.importlinter.contracts]]
name = "Only app.ai talks to an LLM provider"
type = "forbidden"
source_modules = ["app.domain", "app.market", "app.routes", "app.config"]
forbidden_modules = ["anthropic", "pydantic_ai", "google"]
allow_indirect_imports = true
