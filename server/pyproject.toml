[project]
name = "wealthpilot-server"
version = "0.1.0"
description = "FastAPI backend for the WealthPilot AI prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "pydantic-ai-slim[google,anthropic]",
  "yfinance",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
